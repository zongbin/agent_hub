spring:
  application:
    name: agent-hub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Spring AI — 模型调用（阿里云百炼 DashScope）
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
    # PgVector VectorStore（需要引入 spring-ai-pgvector-store 依赖后启用）
    # vectorstore:
    #   pgvector:
    #     initialize-schema: true
    #     dimensions: 1024
    #     distance-type: COSINE_DISTANCE
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      # 显式指定 multipart 临时目录，避免 Tomcat 使用系统默认 temp 目录时权限不足
      location: ${MULTIPART_TEMP_DIR:${java.io.tmpdir}}
      # 文件写入磁盘的阈值（超过此大小才写入 temp，小文件驻留内存减少 IO）
      file-size-threshold: 1MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/agent_hub?stringtype=unspecified
    username: ${DB_USER:agenthub}
    password: ${DB_PASS:agenthub}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
  # JPA / Hibernate — 自动管理数据库 schema
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true

server:
  port: 8080
  servlet:
    context-path: /api

# Windows 控制台默认 GBK，与源码/日志 UTF-8 不一致会导致中文乱码
logging:
  charset:
    console: UTF-8
    file: UTF-8

# 自定义配置
agenthub:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-string}
    expiration-hours: 168   # 7 天
    header: Authorization
    prefix: "Bearer "
  storage:
    # 本地文件系统存储，后续迁移到 MinIO / S3 时替换实现
    root-path: ${STORAGE_ROOT_PATH:./data/docs}
  llm:
    chat-model: qwen-plus
  embedding:
    # 灵积平台（DashScope）通用文本向量接口
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
    api-key: ${DASHSCOPE_API_KEY:}
    model: text-embedding-v3
    dimensions: 1024
    batch-size: 10
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  super-agent:
    service-url: ${AGENT_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 300000
  chunk:
    size: 512
    overlap: 50
  qa:
    top-k: 5              # 检索返回的分块数
    snippet-length: 500   # 前端展示的引用片段长度
    history-size: 6       # 携带进 prompt 的历史消息条数
    history-msg-length: 200  # 历史消息在 prompt 中的截断长度

# Knife4j / OpenAPI 文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
  default-flat-param-object: true
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
