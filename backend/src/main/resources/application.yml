spring:
  application:
    name: agent-hub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/agent_hub?stringtype=unspecified
    username: ${DB_USER:agenthub}
    password: ${DB_PASS:agenthub}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASS:}
      database: ${REDIS_DB:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.leon.agenthub.**.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080
  servlet:
    context-path: /api

# 自定义配置
agenthub:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-string}
    expiration-hours: 168   # 7 天
    header: Authorization
    prefix: "Bearer "
  storage:
    # 本地文件系统存储，后续迁移到 MinIO / S3 时替换实现
    root-path: ${STORAGE_ROOT_PATH:./data/docs}
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    chat-model: deepseek-chat
    embedding-model: bge-large-zh
  super-agent:
    service-url: ${AGENT_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 300000
  chunk:
    size: 512
    overlap: 50

# Knife4j / OpenAPI 文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
  default-flat-param-object: true
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
